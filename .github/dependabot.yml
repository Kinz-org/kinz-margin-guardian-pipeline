# Dependency updates. Minor and patch bumps are grouped into one PR per
# ecosystem so a weekly run does not open a dozen PRs at once; majors stay
# separate because they are the ones that break things.
version: 2
updates:
  # requirements.txt, requirements-api.txt, requirements-dashboard.txt and
  # requirements-airflow.txt all live at the repo root.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
